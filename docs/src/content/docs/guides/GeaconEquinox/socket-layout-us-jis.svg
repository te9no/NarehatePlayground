      <use href="#k100" x="326" y="318" transform="rotate(10 376 368)"><title>RC(2,3)</title></use>
      <use href="#k100" x="424" y="337" transform="rotate(10 474 387)"><title>RC(4,3)</title></use>
      <use href="#k100" x="524" y="350" transform="rotate(5 574 400)"><title>RC(5,3)</title></use>
      <use href="#k100" x="625" y="355"><title>RC(6,3)</title></use>
      <use href="#k100" x="1026" y="350" transform="rotate(-5 1076 400)"><title>RC(0,10)</title></use>
      <use href="#k100" x="1126" y="337" transform="rotate(-10 1176 387)"><title>RC(1,10)</title></use>
      <use href="#k100" x="1224" y="318" transform="rotate(-10 1274 368)"><title>RC(3,10)</title></use>
      <use href="#k100" x="1324" y="304" transform="rotate(-5 1374 354)"><title>RC(4,10)</title></use>
      <use href="#k100" x="1425" y="300"><title>RC(5,10)</title></use>
      <use href="#k100" x="1525" y="300" class="binding"><title>RC(6,10)</title></use>
      <use href="#k100" x="1650" y="325"><title>RC(0,9)</title></use>

      <use href="#k125" x="0" y="400"><title>RC(0,2)</title></use>
      <use href="#k125" x="125" y="400"><title>RC(1,2)</title></use>
      <use href="#k125" x="253" y="409" transform="rotate(7 316 459)"><title>RC(3,2)</title></use>
      <use href="#k100" x="325" y="445" transform="rotate(11.95 457 785)"><title>RC(4,2)</title></use>
      <use href="#k175" x="473" y="455" transform="rotate(4.45 585 801)"><title>RC(5,2)</title></use>
      <use href="#k100" x="1002" y="455" transform="rotate(-4.45 1065 801)"><title>RC(2,9)</title></use>
      <use href="#k100" x="1550" y="425"><title>RC(3,9)</title></use>
      <use href="#k100" x="1650" y="425"><title>RC(4,9)</title></use>
      <use href="#k100" x="1750" y="425"><title>RC(5,9)</title></use>
    </g>

    <g id="common-labels">
      <text x="112.5" y="360" class="tag stab">S1</text>
      <text x="1575" y="360" class="tag">D</text>
    </g>
  </defs>

  <rect x="-50" y="-110" width="1950" height="1590" fill="white"/>

  <text x="0" y="-65" font-weight="bold">
    US：左29・右34 ／ キー上面視（ソケットは裏面）
  </text>
  <text x="0" y="-25" class="note">左手</text>
  <text x="900" y="-25" class="note">右手</text>

  <use href="#common"/>
  <use href="#common-labels"/>
  <g class="changed">
    <rect x="1600" y="0" width="200" height="100">
      <title>A RC(1,13) SW37A</title>
    </rect>
    <rect x="1650" y="100" width="150" height="100">
      <title>B RC(5,12) SW46</title>
    </rect>
    <rect x="1575" y="200" width="225" height="100">
      <title>C RC(6,11) SW53A</title>
    </rect>
  </g>
  <rect x="1700" y="0" width="100" height="100" class="unused">
    <title>X: JIS RC(2,13)の領域。USでは独立キーなし</title>
  </rect>
  <text x="1650" y="42" class="tag">A</text>
  <text x="1750" y="42" class="tag">X</text>
  <text x="1700" y="82" class="tag stab">S2</text>
  <text x="1725" y="160" class="tag">B</text>
  <text x="1687.5" y="260" class="tag">C</text>
  <text x="0" y="610" class="note">
    X＝RC(2,13)は未使用。斜線はUS Backspaceが覆うJISキー領域。
  </text>

  <!-- 表示用の平行移動のみ。内部のphysical layout座標はUSと同じ原点。 -->
  <g transform="translate(0 750)">
    <text x="0" y="-65" font-weight="bold">
      JIS：左29・右35 ／ 左手はUSと共通
    </text>
    <use href="#common"/>
    <use href="#common-labels"/>
    <g class="changed">
      <rect x="1600" y="0" width="100" height="100">
        <title>A RC(1,13) SW37</title>
      </rect>
      <rect x="1700" y="0" width="100" height="100">
        <title>X RC(2,13) SW38</title>
      </rect>
      <rect x="1650" y="100" width="150" height="200">
        <title>B RC(5,12) SW46A。矩形はdevicetreeの定義</title>
      </rect>
      <rect x="1575" y="200" width="100" height="100">
        <title>C RC(6,11) SW53</title>
      </rect>
    </g>
    <text x="1650" y="55" class="tag">A</text>
    <text x="1750" y="55" class="tag">X</text>
    <text x="1725" y="165" class="tag">B</text>
    <text x="1725" y="225" class="tag stab">S3</text>
    <text x="1625" y="260" class="tag">C</text>
  </g>

  <text x="0" y="1355" class="note">
    橙 A–C・X：形状／使用位置差。紫 D：割当のみ差。緑 S1–S3：取付候補（穴座標ではない）。
  </text>
  <text x="0" y="1395" class="note">
    ◉ 左ダイヤル ／ ◉ 右トラックボール：devicetreeに座標なし。欄外記号であり位置を示さない。
  </text>
  <text x="0" y="1435" class="note">
    矩形・回転は原定義を保持。JIS Enterの矩形重なりも原定義どおり。基板外形・穴・パッドは未描画。
  </text>
</svg>
