<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-50 -110 1950 1590"
     role="img" aria-labelledby="title desc">
  <title id="title">GeaconEquinox US/JIS 実装位置の比較</title>
  <desc id="desc">
    キー領域はphysical layoutの座標と回転を使用。
    パッドや基板外形の図ではない。
    S1からS3はスタビライザー候補を対応キーに示した記号で、穴座標ではない。
    ダイヤルとトラックボールは座標未定義のため欄外表示。
  </desc>
  <metadata>
    Repository commit: 5d3903aa0dda24a6523f7d7e479e014cbb075db8
    snippets/equinox-us/equinox-us.overlay: layout_US
    snippets/equinox-jis/equinox-jis.overlay: layout_JIS
    EasyEDA GeaconEquinox v0.2: GeaconSolstice_L / GeaconSolstice_R
  </metadata>

  <style>
    text{font-family:sans-serif;fill:#172033;font-size:26px}
    .keys{fill:#eef2f6;stroke:#64748b;stroke-width:2}
    .changed{fill:#ffedd5;stroke:#c2410c;stroke-width:3}
    .binding{fill:#ede9fe;stroke:#7c3aed}
    .unused{fill:url(#hatch);stroke:#be123c;stroke-width:3;stroke-dasharray:8 5}
    .tag{font-size:24px;font-weight:bold;text-anchor:middle}
    .stab{fill:#047857;font-weight:bold}
    .note{font-size:23px}
  </style>

  <defs>
    <rect id="k100" width="100" height="100"/>
    <rect id="k125" width="125" height="100"/>
    <rect id="k150" width="150" height="100"/>
    <rect id="k175" width="175" height="100"/>
    <rect id="k225" width="225" height="100"/>
    <pattern id="hatch" width="16" height="16"
             patternUnits="userSpaceOnUse">
      <path d="M-4 4L4-4M0 16L16 0M12 20L20 12"
            stroke="#fb7185" stroke-width="3"/>
    </pattern>

    <!-- US/JIS共通の60キー。座標・寸法・回転中心は原定義を保持。 -->
    <g id="common" class="keys">
      <use href="#k100" x="0" y="0"><title>RC(0,6)</title></use>
      <use href="#k100" x="100" y="0"><title>RC(1,6)</title></use>
      <use href="#k100" x="201" y="2" transform="rotate(3.75 251 52)"><title>RC(2,6)</title></use>
      <use href="#k100" x="301" y="13" transform="rotate(8.75 351 63)"><title>RC(3,6)</title></use>
      <use href="#k100" x="400" y="33" transform="rotate(11.25 450 83)"><title>RC(4,6)</title></use>
      <use href="#k100" x="499" y="48" transform="rotate(6.25 549 98)"><title>RC(5,6)</title></use>
      <use href="#k100" x="900" y="54" transform="rotate(1.25 950 104)"><title>RC(0,14)</title></use>
      <use href="#k100" x="1001" y="52" transform="rotate(-3.75 1051 102)"><title>RC(1,14)</title></use>
      <use href="#k100" x="1101" y="41" transform="rotate(-8.75 1151 91)"><title>RC(2,14)</title></use>
      <use href="#k100" x="1200" y="22" transform="rotate(-11.25 1250 72)"><title>RC(3,14)</title></use>
      <use href="#k100" x="1299" y="7" transform="rotate(-6.25 1349 57)"><title>RC(4,14)</title></use>
      <use href="#k100" x="1400" y="0" transform="rotate(-1.25 1450 50)"><title>RC(5,14)</title></use>
      <use href="#k100" x="1500" y="0"><title>RC(0,13)</title></use>

      <use href="#k150" x="0" y="100"><title>RC(0,5)</title></use>
      <use href="#k100" x="150" y="100" transform="rotate(1.25 200 150)"><title>RC(1,5)</title></use>
      <use href="#k100" x="251" y="107" transform="rotate(6.25 301 157)"><title>RC(2,5)</title></use>
      <use href="#k100" x="350" y="122" transform="rotate(11.25 400 172)"><title>RC(3,5)</title></use>
      <use href="#k100" x="449" y="141" transform="rotate(8.75 499 191)"><title>RC(4,5)</title></use>
      <use href="#k100" x="549" y="152" transform="rotate(3.75 599 202)"><title>RC(6,5)</title></use>
      <use href="#k100" x="950" y="154" transform="rotate(-1.25 1000 204)"><title>RC(3,13)</title></use>
      <use href="#k100" x="1051" y="148" transform="rotate(-6.25 1101 198)"><title>RC(4,13)</title></use>
      <use href="#k100" x="1150" y="133" transform="rotate(-11.25 1200 183)"><title>RC(6,13)</title></use>
      <use href="#k100" x="1249" y="113" transform="rotate(-8.75 1299 163)"><title>RC(0,12)</title></use>
      <use href="#k100" x="1349" y="102" transform="rotate(-3.75 1399 152)"><title>RC(1,12)</title></use>
      <use href="#k100" x="1450" y="100"><title>RC(2,12)</title></use>
      <use href="#k100" x="1550" y="100"><title>RC(3,12)</title></use>

      <use href="#k175" x="0" y="200"><title>RC(0,4)</title></use>
      <use href="#k100" x="175" y="201" transform="rotate(2.5 225 251)"><title>RC(1,4)</title></use>
      <use href="#k100" x="276" y="210" transform="rotate(7.5 326 260)"><title>RC(2,4)</title></use>
      <use href="#k100" x="375" y="227" transform="rotate(12.5 425 277)"><title>RC(3,4)</title></use>
      <use href="#k100" x="474" y="245" transform="rotate(7.5 524 295)"><title>RC(5,4)</title></use>
      <use href="#k100" x="575" y="254" transform="rotate(2.5 625 304)"><title>RC(6,4)</title></use>
      <use href="#k100" x="975" y="254" transform="rotate(-2.5 1025 304)"><title>RC(6,12)</title></use>
      <use href="#k100" x="1076" y="245" transform="rotate(-7.5 1126 295)"><title>RC(0,11)</title></use>
      <use href="#k100" x="1175" y="227" transform="rotate(-12.5 1225 277)"><title>RC(1,11)</title></use>
      <use href="#k100" x="1274" y="210" transform="rotate(-7.5 1324 260)"><title>RC(2,11)</title></use>
      <use href="#k100" x="1375" y="201" transform="rotate(-2.5 1425 251)"><title>RC(4,11)</title></use>
      <use href="#k100" x="1475" y="200"><title>RC(5,11)</title></use>

      <use href="#k225" x="0" y="300"><title>RC(0,3)</title></use>
